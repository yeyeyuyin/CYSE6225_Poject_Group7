<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Detail — Web Video Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Video<span>Finder</span></a>
      <nav id="auth-nav"></nav>
    </div>
  </header>

  <main class="container">
    <div id="detail-root">
      <div class="player-wrap">
        <iframe id="player-frame" allowfullscreen></iframe>
      </div>
      <div id="source-bar"></div>

      <h1 id="video-title"></h1>
      <div class="video-meta-row">
        <span id="video-rating"></span>
        <span id="video-clicks"></span>
      </div>
      <div id="video-tags"></div>
      <p id="video-description" class="muted"></p>

      <div class="action-row">
        <button id="favorite-btn" class="secondary">☆ Add to Watchlist</button>
        <button id="report-btn" class="secondary">🚩 Report Broken Link / Cannot Play</button>
      </div>

      <div class="section">
        <h3>Rate this title</h3>
        <form id="rating-form">
          <select id="rating-select">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <button type="submit">Submit Rating</button>
        </form>
      </div>

      <div class="section">
        <h3>Comments</h3>
        <form id="comment-form">
          <input id="comment-input" type="text" placeholder="Share your thoughts..." />
          <button type="submit">Post</button>
        </form>
        <div id="comments-list" style="margin-top: 16px;"></div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>

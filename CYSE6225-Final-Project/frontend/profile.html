<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Web Video Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Video<span>Finder</span></a>
      <nav id="auth-nav"></nav>
    </div>
  </header>

  <main class="container">
    <div class="profile-grid">
      <div>
        <div class="profile-card">
          <h2>Account</h2>
          <p class="muted">Email: <span id="email-display"></span></p>
          <form id="profile-form">
            <label for="nickname-input">Nickname</label>
            <input id="nickname-input" type="text" />
            <label for="avatar-input">Avatar URL</label>
            <input id="avatar-input" type="text" placeholder="https://..." />
            <button type="submit">Save Profile</button>
            <p id="profile-message" class="muted"></p>
          </form>
        </div>

        <div class="profile-card">
          <h2>Change Password</h2>
          <form id="password-form">
            <label for="old-password-input">Current Password</label>
            <input id="old-password-input" type="password" required />
            <label for="new-password-input">New Password</label>
            <input id="new-password-input" type="password" required minlength="8" />
            <button type="submit">Update Password</button>
            <p id="password-message" class="muted"></p>
          </form>
        </div>
      </div>

      <div>
        <div class="profile-card">
          <h2>My Watchlist</h2>
          <div id="watchlist-list"></div>
        </div>

        <div class="profile-card">
          <h2>Watch History</h2>
          <div id="history-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

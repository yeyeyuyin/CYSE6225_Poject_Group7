# Reverse proxy: public :80 -> Gunicorn on 127.0.0.1:8000
# Also serves the static frontend directly from /opt/webvideofinder/frontend.
# Swap this for S3+CloudFront later if you'd rather host the frontend separately.

server {
    listen 80;
    server_name _;

    root /opt/webvideofinder/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
